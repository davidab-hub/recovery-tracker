<!doctype html>
<html lang="en" data-theme="light" data-palette="coral">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Set your password</title>
  <style>
    :root {
      /* Bounce brand */
      --brand: #e3262b; --brand-dark: #b91c21; --brand-tint: #3a1517; --side: #16181d; --side-2: #1f2228; --side-text: #9aa0aa;
      --page: #f4f5f8; --card: #ffffff; --text: #111827; --text-2: #4b5563; --muted: #6b7280;
      --border: #e5e7eb; --grid: #e1e0d9; --axis: #c3c2b7;
      --red: #e3262b; --blue: #2563eb; --green: #16a34a; --orange: #d97706; --dark: #1f2937;
      --input: #ffffff; --soft: #f5f6f8; --hover: #eef4ff; --ring: #93c5fd; --label: #374151; --tip: #ffffff; --tip-text: #111827;
      --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #6250d6;
    }

    /* ===== Themes: switch with the buttons at the top right ===== */
    html[data-theme="dark"] {
      --page: #0b1020; --card: #121a2f; --text: #e8ecf5; --text-2: #b4bdd0; --muted: #8590a8;
      --border: #222c47; --grid: rgba(255,255,255,.07); --axis: #2f3a58; --dark: #2a3452;
      --input: #0e1528; --soft: #18213a; --hover: #1d2848; --ring: #4f7ddb; --label: #dfe5f2; --tip: #1a2340; --tip-text: #e8ecf5;
      --side: #080c18; --side-2: #121a2f; --brand-tint: #3a1219;
      --s1: #4c95ef; --s2: #f07a45; --s3: #2cc28c; --s4: #f2b31b; --s5: #ef8fb3; --s6: #4fb84f; --s7: #8b7cf0;
      --blue: #5b9df5; --green: #34d399; --orange: #f59e0b;
    }
    html[data-theme="dark"] .card, html[data-theme="dark"] .panel, html[data-theme="dark"] .bar {
      background: linear-gradient(180deg, #141d34, #10172b); box-shadow: 0 8px 24px rgba(0,0,0,.35); }
    html[data-theme="dark"] .cards .card { border-top: 2px solid var(--k); }
    html[data-theme="dark"] .cards .card .value { text-shadow: 0 0 18px color-mix(in srgb, var(--k) 55%, transparent); }
    html[data-theme="dark"] .card .ico { box-shadow: 0 0 14px color-mix(in srgb, var(--k) 45%, transparent); }
    html[data-theme="dark"] .page-title { color: #fff; }

    html[data-theme="gradient"] .cards .card { background: linear-gradient(135deg, var(--k), color-mix(in srgb, var(--k) 62%, #1a0a2e));
      border: none; color: #fff; box-shadow: 0 6px 18px color-mix(in srgb, var(--k) 35%, transparent); }
    html[data-theme="gradient"] .cards .card .label, html[data-theme="gradient"] .cards .card .sub,
    html[data-theme="gradient"] .cards .card .value, html[data-theme="gradient"] .cards .card .more { color: #fff !important; }
    html[data-theme="gradient"] .cards .card .label, html[data-theme="gradient"] .cards .card .sub { opacity: .88; }
    html[data-theme="gradient"] .card .ico { background: rgba(255,255,255,.22) !important; color: #fff !important; }
    html[data-theme="gradient"] .card .delta { background: rgba(255,255,255,.22) !important; color: #fff !important; }
    html[data-theme="gradient"] .card .meter { background: rgba(255,255,255,.25); }
    html[data-theme="gradient"] .panel { box-shadow: 0 4px 14px rgba(17,24,39,.06); border-color: transparent; }

    html[data-theme="light"] .cards .card, html[data-theme="light"] .panel { box-shadow: 0 1px 2px rgba(17,24,39,.04), 0 4px 12px rgba(17,24,39,.05); }

    /* Card extras: icon badge, change vs yesterday, sparkline, meter */
    .card .top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
    .card .ico { width: 30px; height: 30px; border-radius: 9px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
      color: var(--k); background: color-mix(in srgb, var(--k) 14%, transparent); }
    .card .ico svg { width: 16px; height: 16px; }
    .card .vrow { display: flex; align-items: baseline; gap: 8px; }
    .card .value { color: var(--k) !important; }
    html[data-theme="light"] .card .value, html:not([data-theme]) .card .value { color: var(--text) !important; }
    .card .delta { font-size: 10.5px; font-weight: 700; padding: 1px 6px; border-radius: 999px; white-space: nowrap; }
    .delta.good { color: #15803d; background: rgba(22,163,74,.12); } .delta.bad { color: #c81e1e; background: rgba(227,38,43,.12); }
    .delta.flat { color: var(--muted); background: var(--soft); }
    html[data-theme="dark"] .delta.good { color: #4ade80; } html[data-theme="dark"] .delta.bad { color: #ff7b7f; }
    .card canvas.spark { display: block; width: 100%; height: 30px; margin-top: 6px; }
    .card .meter { height: 6px; border-radius: 999px; background: var(--soft); margin-top: 8px; overflow: hidden; display: flex; }
    .card .meter span { display: block; height: 100%; }
    .themes { display: inline-flex; background: var(--soft); border: 1px solid var(--border); border-radius: 999px; padding: 3px; gap: 2px; margin-left: auto; align-self: center; }
    .themes button { border: none; background: transparent; color: var(--text-2); font: 600 12px inherit; font-family: inherit; padding: 4px 12px; border-radius: 999px; cursor: pointer; }
    .themes button.on { background: var(--brand); color: #fff; }
    .tabs-top { align-items: flex-end; flex-wrap: wrap; }
    @media (max-width: 600px) { .themes { margin: 6px 0 8px; } }

    /* ===== Colours: Bounce red, soft coral shades ===== */
    :root { --a1: #86b6ef; --a2: #3987e5; --a3: #1c5cab; --a4: #0d366b; }
    html[data-palette="coral"] {
      --page: #fff8f7; --card: #ffffff; --border: #f7e6e3; --input: #ffffff; --soft: #fff1ef; --hover: #fde4e2; --ring: #f68179;
      --text: #2a1d1e; --text-2: #5b4a4b; --muted: #8a7778; --label: #4a3536; --tip: #ffffff; --tip-text: #2a1d1e;
      --grid: rgba(120,40,40,.07); --axis: #f7e6e3;
      --s1: #f68179; --s2: #fcceca; --s3: #f02719; --s4: #feedec; --s5: #f35449; --s6: #f9aaa4; --s7: #c9190d; --red: #f35449; --dark: #f02719;
      --a1: #fddbd9; --a2: #f89c96; --a3: #f35449; --a4: #d81b0e;
    }
    html[data-palette="coral"] .cards .card { --k: #f68179 !important; }
    html[data-palette="coral"] .card .value { color: var(--text) !important; }
    html[data-palette="coral"] .card .delta { color: #b6170c !important; background: #fde4e2 !important; }
    html[data-palette="coral"] .pill:not(.off) { background: #f68179; border-color: #f68179; color: #861109; }
    html[data-palette="coral"] .page-title { color: var(--text); }
    html[data-palette="coral"] .cards .card, html[data-palette="coral"] .panel, html[data-palette="coral"] .bar { box-shadow: 0 1px 2px rgba(120,30,30,.04), 0 6px 16px rgba(120,30,30,.05); }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background: var(--page); color: var(--text); }

    /* App layout: dark sidebar + content */
    .app { display: flex; min-height: 100vh; }
    .side { width: 220px; flex-shrink: 0; background: var(--side); color: #fff; display: flex; flex-direction: column;
            position: sticky; top: 0; height: 100vh; }
    .side .collapse { text-align: right; padding: 10px 14px; color: var(--side-text); font-size: 15px; border-bottom: 1px solid #262930; }
    .brandrow { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid #262930; }
    .logo { width: 38px; height: 38px; border-radius: 50%; background: var(--brand); color: #fff; display: flex; align-items: center;
            justify-content: center; text-align: center; font-size: 8px; font-weight: 800; line-height: 1.1; letter-spacing: .03em; overflow: hidden; flex-shrink: 0; }
    .logo img { width: 100%; height: 100%; object-fit: cover; }
    .brandname { font-size: 14px; font-weight: 700; }
    .brandname span { color: var(--brand); }
    .navsec { padding: 12px 0 4px 16px; font-size: 10.5px; font-weight: 700; letter-spacing: .12em; color: #6b717c; }
    .nav a { display: flex; align-items: center; gap: 10px; padding: 8px 16px; color: var(--side-text); text-decoration: none; font-size: 13.5px;
             border-left: 3px solid transparent; }
    .nav a:hover { background: var(--side-2); color: #fff; }
    .nav a.active { background: var(--brand-tint); color: #fff; font-weight: 700; border-left-color: var(--brand); }
    .nav svg { width: 16px; height: 16px; flex-shrink: 0; }
    .side .foot { margin-top: auto; border-top: 1px solid #262930; padding: 10px 14px; font-size: 12px; color: var(--side-text); }
    .side .foot .live { display: flex; align-items: center; gap: 8px; }
    .side .foot .live i { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; display: inline-block; }
    .content { flex: 1; min-width: 0; }
    main { max-width: 1520px; margin: 0 auto; padding: 4px 24px 28px; }
    .tabs-top { display: flex; gap: 8px; border-bottom: 1px solid var(--border); margin: 0 0 14px; padding-top: 12px; }
    .tabs-top a { padding: 8px 14px; font-size: 14.5px; font-weight: 600; color: var(--text-2); text-decoration: none; border-bottom: 3px solid transparent; margin-bottom: -1px; }
    .tabs-top a.active { color: var(--brand); border-bottom-color: var(--brand); }
    .page-title { margin: 0; font-size: 21px; font-weight: 800; }
    .page-sub { margin: 3px 0 14px; color: var(--muted); font-size: 13px; }
    .menu-btn { display: none; }
    @media (max-width: 900px) {
      .app { flex-direction: column; }
      .side { width: 100%; height: auto; position: static; }
      .side .collapse, .side .foot, .navsec { display: none; }
      .side .nav { display: none; }
      .side.open .nav { display: block; }
      .brandrow { justify-content: space-between; padding: 12px 16px; }
      .menu-btn { display: inline-block; background: none; border: 1px solid #3a3d44; color: #fff; border-radius: 8px; padding: 6px 10px; font-size: 18px; }
      main { padding: 8px 16px 32px; }
    }
    /* Show / hide pills for chart lines (brand red when on) */
    .pills { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 12px; }
    .pill { border: 1.5px solid var(--brand); background: var(--brand); color: #fff; border-radius: 999px; padding: 4px 12px;
            font-size: 12px; font-weight: 600; cursor: pointer; font-family: inherit; display: inline-flex; align-items: center; gap: 8px; }
    .pill i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; border: 1.5px solid #fff; }
    .pill.off { background: var(--input); color: var(--text-2); border-color: var(--border); }
    .pill.off i { border-color: transparent; }

    /* Top filter bar (matches the design) */
    .bar { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px;
           display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; margin-bottom: 14px; }
    .bar label { font-size: 12.5px; font-weight: 600; color: var(--muted); }
    .bar select { padding: 6px 8px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px;
                  background: var(--input); color: var(--text); min-width: 120px; }
    .bar .spacer { flex: 1; }
    .btn { border: none; border-radius: 8px; padding: 6px 14px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; }
    .btn-clear { background: var(--red); color: #fff; }
    .btn-sync { background: var(--dark); color: #fff; }
    .synced { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); }
    .synced i { width: 9px; height: 9px; border-radius: 50%; background: #9ca3af; display: inline-block; }
    .synced.ok i { background: #22c55e; }
    .synced.err i { background: var(--red); }
    .bar a { font-size: 12.5px; color: var(--blue); }

    /* KPI cards */
    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(175px, 1fr)); gap: 10px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; min-height: 92px; }
    .card .label { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
    .card .value { font-size: 24px; font-weight: 800; margin-top: 3px; line-height: 1.1; }
    .card .sub { font-size: 11.5px; color: var(--muted); margin-top: 3px; line-height: 1.4; }
    .c-red { color: var(--red); } .c-blue { color: var(--blue); } .c-green { color: var(--green); }
    .c-orange { color: var(--orange); } .c-dark { color: var(--text); }

    /* Detail section below the cards */
    .section-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; margin: 20px 0 8px; }
    .section-head h2 { margin: 0; font-size: 13px; font-weight: 700; color: var(--text-2); text-transform: uppercase; letter-spacing: .05em; }
    .section-head select { padding: 5px 8px; border: 1px solid var(--border); border-radius: 8px; font-size: 12.5px; background: var(--input); color: var(--text); }
    .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 10px; }
    @media (max-width: 520px) { .grid2 { grid-template-columns: 1fr; } .bar select { min-width: 0; flex: 1 1 120px; } }
    .panel { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px; min-width: 0; }
    .panel h3 { margin: 0 0 2px; font-size: 13.5px; font-weight: 600; }
    .panel .note { margin: 0 0 6px; font-size: 11px; color: var(--muted); }
    .chart { position: relative; height: 230px; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th, td { padding: 6px 8px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; }
    th { font-size: 11px; color: var(--text-2); text-transform: uppercase; letter-spacing: .03em; background: var(--soft); }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
    tr:last-child td { border-bottom: none; }
    .bad { color: var(--red); font-weight: 600; }
    /* Count strip at the top of each panel */
    .counts { display: flex; flex-wrap: wrap; gap: 6px; margin: 2px 0 8px; }
    .count { background: var(--soft); border-radius: 8px; padding: 5px 10px; min-width: 76px; }
    .count .n { font-size: 17px; font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; }
    .count .t { font-size: 11px; color: var(--muted); margin-top: 2px; display: flex; align-items: center; gap: 6px; }
    .count .t i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    button.count { border: 1px solid transparent; text-align: left; font-family: inherit; color: inherit; cursor: pointer; }
    button.count:hover, button.count:focus-visible { border-color: var(--ring); background: var(--hover); outline: none; }
    /* Clickable KPI cards */
    .cards .card { cursor: pointer; transition: border-color .15s, box-shadow .15s, transform .15s; }
    .cards .card:hover, .cards .card:focus-visible { border-color: var(--ring); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ring) 35%, transparent); outline: none; transform: translateY(-1px); }
    .cards .card .more { font-size: 11px; color: var(--blue); margin-top: 4px; opacity: 0; transition: opacity .15s; }
    .cards .card:hover .more, .cards .card:focus-visible .more { opacity: 1; }
    .panel.flash { box-shadow: 0 0 0 3px var(--ring); transition: box-shadow .3s; }
    /* Details pop-up */
    dialog#detail { background: var(--card); color: var(--text); border: 1px solid var(--border); border-radius: 14px; padding: 0; width: min(900px, 94vw); max-height: 86vh; }
    dialog#detail::backdrop { background: rgba(0,0,0,.4); }
    .dhead { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 16px 18px; border-bottom: 1px solid var(--border); }
    .dhead h2 { margin: 0; font-size: 16px; flex: 1; }
    .dhead .big { font-size: 22px; font-weight: 800; }
    .dbody { padding: 0 18px 16px; max-height: 64vh; overflow: auto; }
    .dbody p { color: var(--muted); font-size: 13px; }
    .btn-light { background: var(--input); border: 1px solid var(--border); color: var(--text); }
    .hidden { display: none !important; }
      /* QC page extras */
    .login { max-width: 420px; margin: 20px 0; }
    .login label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
    .login input { width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; background: var(--input); color: var(--text); font-family: inherit; }
    .login button { margin-top: 14px; width: 100%; padding: 9px; }
    .login .err { color: var(--s3); font-size: 13px; min-height: 1em; margin: 8px 0 0; }
    .authbox { display: flex; flex-direction: column; gap: 8px; padding-bottom: 10px; margin-bottom: 10px; border-bottom: 1px solid #262930; }
    .authbox .who { color: #d1d5db; word-break: break-all; }
    .authbox button { width: 100%; padding: 6px; background: transparent; border: 1px solid #3a3d44; color: var(--brand); font-size: 12.5px; font-weight: 600; border-radius: 8px; cursor: pointer; font-family: inherit; }
    .card .value.small { font-size: 15px !important; line-height: 1.25; margin-top: 6px; }
    td.wrap { white-space: normal; min-width: 260px; max-width: 420px; }
    tr.click { cursor: pointer; } tr.click:hover td { background: var(--hover); }
      .setpw { max-width: 420px; margin: 8vh auto; }
    .setpw .logo { margin-bottom: 12px; }
    /* Admin contact details */
    .contact { margin-top: 14px; padding: 10px 12px; border-radius: 8px; background: var(--soft); font-size: 12.5px; line-height: 1.6; color: var(--text-2, var(--muted)); }
    .contact a { color: var(--accent, var(--brand)); font-weight: 600; text-decoration: none; }
    .contact-side { font-size: 11.5px; line-height: 1.5; color: var(--side-text); padding: 0 0 10px; margin-bottom: 10px; border-bottom: 1px solid #262930; word-break: break-all; }
    .contact-side a { color: #d1d5db; text-decoration: none; }
    .contact-side a:hover { color: #fff; }
    @media (min-width: 901px) { html.side-min .contact-side { display: none; } }
  </style>
</head>
<body>
  <main>
    <section class="panel login setpw">
      <div class="logo"><img src="logo.png" alt="Bounce" onerror="this.parentNode.textContent = 'BOUNCE DAILY'"></div>
      <h3 id="spTitle">Choose your password</h3>
      <p class="note" id="spNote">Checking your link…</p>
      <button class="btn btn-clear hidden" type="button" id="goBtn" style="width:100%;padding:9px;margin-top:6px">Continue</button>
      <form id="pwForm" class="hidden">
        <p class="note" id="spWho"></p>
        <label for="pw1">New password (at least 8 characters)</label><input id="pw1" type="password" autocomplete="new-password" minlength="8" required>
        <label for="pw2">Type it again</label><input id="pw2" type="password" autocomplete="new-password" minlength="8" required>
        <button class="btn btn-clear" type="submit" id="pwBtn">Save password &amp; open dashboard</button>
        <p class="err" id="pwErr"></p>
      </form>
      <div class="contact"><strong>Need access or help?</strong> Contact the admin, David Abraham:<br>
        <a href="mailto:david.abraham@bounceshare.com">david.abraham@bounceshare.com</a> · <a href="tel:+919180260780">+91 91802 60780</a> · <a href="https://wa.me/919180260780" target="_blank" rel="noopener">WhatsApp</a></div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script>
    // The link carries a one-time code. We only use it when the person presses "Continue",
    // so link previews in WhatsApp / email can't use it up.
    const qs = new URLSearchParams(location.search), hash = new URLSearchParams(location.hash.slice(1));
    const tokenHash = qs.get('token_hash'), linkType = qs.get('type') === 'recovery' ? 'recovery' : 'invite';
    const linkError = hash.get('error_description') || qs.get('error_description');
    const db = supabase.createClient('https://ibsgrnuefzarnxguyfpn.supabase.co', 'yeyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imlic2dybnVlZnphcm54Z3V5ZnBuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI1NzQzMzksImV4cCI6MjEwODE1MDMzOX0.XImDA-444nhb0pLpbx4K6Jn5fsROhG9usviEFX5ATEU');
    const $ = (id) => document.getElementById(id);
    const clean = (s) => String(s || '').replace(/[<>&]/g, '');
    function expired(msg) {
      $('spTitle').textContent = 'This link has expired';
      $('spNote').innerHTML = (msg ? clean(msg) + '. ' : '') + 'Sign-in links work once and only for 24 hours. Ask the admin below to send you a new link.';
      $('goBtn').classList.add('hidden'); $('pwForm').classList.add('hidden');
    }
    function askPassword(session) {
      history.replaceState(null, '', location.pathname);   // remove the code from the address bar
      $('spTitle').textContent = 'Choose your password';
      $('spNote').textContent = 'Pick a password you will use to sign in to the Bounce dashboards.';
      $('spWho').innerHTML = 'Your login email: <strong>' + clean(session.user.email) + '</strong>';
      $('goBtn').classList.add('hidden'); $('pwForm').classList.remove('hidden');
    }
    if (linkError) expired(linkError);
    else if (tokenHash) {
      $('spTitle').textContent = linkType === 'invite' ? 'Welcome to the Bounce dashboards' : 'Reset your password';
      $('spNote').textContent = 'Press Continue to set your password.';
      $('goBtn').classList.remove('hidden');
      $('goBtn').addEventListener('click', async () => {
        $('goBtn').disabled = true; $('goBtn').textContent = 'Checking…';
        const { data, error } = await db.auth.verifyOtp({ token_hash: tokenHash, type: linkType });
        if (error || !data.session) return expired(error ? error.message : '');
        askPassword(data.session);
      });
    } else setTimeout(async () => {
      const { data: { session } } = await db.auth.getSession();
      session ? askPassword(session) : expired('');
    }, 300);
    $('pwForm').addEventListener('submit', async (e) => {
      e.preventDefault(); $('pwErr').textContent = '';
      if ($('pw1').value.length < 8) return $('pwErr').textContent = 'Use at least 8 characters.';
      if ($('pw1').value !== $('pw2').value) return $('pwErr').textContent = "The two passwords don't match.";
      $('pwBtn').disabled = true;
      const { error } = await db.auth.updateUser({ password: $('pw1').value, data: { password_set: true } });
      if (error) { $('pwErr').textContent = error.message; $('pwBtn').disabled = false; return; }
      $('spTitle').textContent = 'All set ✓'; $('pwForm').classList.add('hidden');
      $('spNote').textContent = 'Your password is saved. Opening the QC Dashboard…';
      setTimeout(() => location.href = 'qc.html', 1200);
    });
  </script>
</body>
</html>
